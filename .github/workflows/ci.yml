name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # npm ci also builds the package through the prepare script.
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit

  browsers:
    name: Browser tests (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      # The Sentinel reporter adds its summary to the job page and fails the run on new issues.
      - run: npx playwright test --project=integration-${{ matrix.browser }} --project=demo-${{ matrix.browser }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sentinel-report-${{ matrix.browser }}
          path: |
            watchdog-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore
